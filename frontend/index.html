<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollow</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/hollow-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&family=Lexend:wght@400;500;600&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;1,6..12,400&family=Rethink+Sans:ital,wght@0,400..700;1,400..700&family=Sora:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply persisted theme + font before first paint (defaults: dark, Sora).
      (function () {
        var theme = localStorage.getItem("theme") ?? "dark";
        document.documentElement.classList.toggle("dark", theme === "dark");
        var font = localStorage.getItem("hollow-font") || "sora";
        var map = {
          sora: '"Sora", ui-sans-serif, system-ui, sans-serif',
          rethink: '"Rethink Sans", ui-sans-serif, system-ui, sans-serif',
          "be-vietnam": '"Be Vietnam Pro", ui-sans-serif, system-ui, sans-serif',
          lexend: '"Lexend", ui-sans-serif, system-ui, sans-serif',
          nunito: '"Nunito Sans", ui-sans-serif, system-ui, sans-serif',
          inter: '"Inter", ui-sans-serif, system-ui, sans-serif',
          system: 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
        };
        document.documentElement.style.setProperty(
          "--font-sans",
          map[font] || map.sora
        );
        document.documentElement.dataset.font = font in map ? font : "sora";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
